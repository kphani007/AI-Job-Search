name: Auto-merge job digest PR

# Auto-merges pull requests from the daily job-scout routine's branch so
# GitHub Pages rebuilds without waiting on a manual merge. Scoped tightly:
# only fires for PRs from claude/pensive-hypatia-a4njmp into master, and
# only merges if the diff touches nothing but the digest's own two files.
# The per-run "Run log" (see docs/SCOUT.md) is appended inside seen-jobs.md
# itself, not a separate file, so it's already covered by the seen-jobs.md
# entry below — no separate allowlist entry needed for it.
on:
  pull_request:
    types: [opened, synchronize]
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.head.ref == 'claude/pensive-hypatia-a4njmp'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check changed files are digest-only
        id: verify
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}"
          changed=$(git diff --name-only "origin/${{ github.event.pull_request.base.ref }}...HEAD")
          echo "Changed files:"
          echo "$changed"
          unexpected=$(echo "$changed" | grep -v -E '^(seen-jobs\.md|docs/index\.html)$' || true)
          if [ -n "$unexpected" ]; then
            echo "safe=false" >> "$GITHUB_OUTPUT"
          else
            echo "safe=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment and skip when diff is out of scope
        if: steps.verify.outputs.safe == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body "$(cat <<'EOF'
          Auto-merge skipped: this PR touches files beyond `seen-jobs.md` / `docs/index.html`. Leaving open for manual review.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_
          EOF
          )"

      - name: Mark ready for review
        if: steps.verify.outputs.safe == 'true' && github.event.pull_request.draft == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr ready "${{ github.event.pull_request.number }}"

      - name: Squash-merge
        if: steps.verify.outputs.safe == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "${{ github.event.pull_request.number }}" --squash
