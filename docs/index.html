<!doctype html>
<title>Job Watch</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  --bg: #f6f7fb;
  --bg-card: #ffffff;
  --text: #1a1d29;
  --text-muted: #5b6072;
  --border: #e3e5ec;
  --accent: #4f5fea;
  --accent-soft: #eef0ff;
  --pm-color: #2f6fed;
  --pm-soft: #e8f0ff;
  --qa-color: #d1670b;
  --qa-soft: #fff1e0;
  --new-badge: #17a673;
  --new-badge-soft: #e3faf0;
  --warn-color: #b45309;
  --warn-soft: #fef3c7;
  --freelance-color: #0f766e;
  --freelance-soft: #ccfbf1;
  --gts-color: #6d28d9;
  --gts-soft: #ede9fe;
  --shadow: 0 1px 2px rgba(20,20,40,0.04), 0 4px 14px rgba(20,20,40,0.05);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1117;
    --bg-card: #171a23;
    --text: #e9ebf2;
    --text-muted: #9aa0b4;
    --border: #262b38;
    --accent: #8a92ff;
    --accent-soft: #22243a;
    --pm-color: #7fa8ff;
    --pm-soft: #17223d;
    --qa-color: #f0a84e;
    --qa-soft: #3a2712;
    --new-badge: #4fd6a4;
    --new-badge-soft: #103426;
    --warn-color: #fbbf24;
    --warn-soft: #453411;
    --freelance-color: #5eead4;
    --freelance-soft: #0f2e2a;
    --gts-color: #c4b5fd;
    --gts-soft: #2e1f57;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 14px rgba(0,0,0,0.35);
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  line-height: 1.45;
}
.wrap { max-width: 980px; margin: 0 auto; padding: 20px 16px 60px; }
header { margin-bottom: 20px; }
h1 { font-size: 1.5rem; margin: 0 0 6px; letter-spacing: -0.01em; }
.meta-row {
  display: flex; flex-wrap: wrap; gap: 10px 18px;
  color: var(--text-muted); font-size: 0.85rem; margin-top: 8px;
}
.stat-strip {
  display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0 4px;
}
.stat-tile {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
  padding: 10px 16px; box-shadow: var(--shadow); flex: 1 1 140px; min-width: 120px;
}
.stat-tile .num { font-size: 1.4rem; font-weight: 700; }
.stat-tile .label { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }

.controls {
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  margin: 20px 0 14px; position: sticky; top: 0; background: var(--bg);
  padding: 10px 0; z-index: 5;
}
#search {
  flex: 1 1 220px; padding: 10px 14px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--bg-card); color: var(--text);
  font-size: 0.95rem; outline: none;
}
#search:focus { border-color: var(--accent); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab-btn {
  padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border);
  background: var(--bg-card); color: var(--text-muted); font-size: 0.83rem;
  cursor: pointer; white-space: nowrap;
}
.tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.tab-btn.gts-nav { border-color: var(--gts-color); color: var(--gts-color); }
.tab-btn.gts-nav:hover { background: var(--gts-soft); }

section { margin-bottom: 28px; }
h2 { font-size: 1.05rem; margin: 0 0 12px; }
.empty-note { color: var(--text-muted); font-size: 0.9rem; padding: 10px 2px; }

.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.job-card {
  display: block; background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 14px; padding: 14px 16px; text-decoration: none; color: var(--text);
  box-shadow: var(--shadow); transition: transform 0.1s ease;
}
.job-card:hover { transform: translateY(-1px); border-color: var(--accent); }
.job-title { font-weight: 650; font-size: 0.98rem; margin-bottom: 4px; }
.job-sub { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 8px; }
.badge-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge {
  font-size: 0.7rem; padding: 3px 9px; border-radius: 999px; font-weight: 600;
}
.badge.pm { background: var(--pm-soft); color: var(--pm-color); }
.badge.qa { background: var(--qa-soft); color: var(--qa-color); }
.badge.other { background: var(--accent-soft); color: var(--accent); }
.badge.new { background: var(--new-badge-soft); color: var(--new-badge); }
.badge.source { background: var(--accent-soft); color: var(--text-muted); }
.badge.unverified { background: var(--warn-soft); color: var(--warn-color); }
.badge.freelance { background: var(--freelance-soft); color: var(--freelance-color); }
.badge.gts { background: var(--gts-soft); color: var(--gts-color); }

.job-list { display: flex; flex-direction: column; gap: 10px; }
.job-row {
  display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline;
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
  padding: 12px 16px; text-decoration: none; color: var(--text); box-shadow: var(--shadow);
}
.job-row:hover { border-color: var(--accent); }
.job-row .jr-title { font-weight: 650; font-size: 0.95rem; }
.job-row .jr-meta { color: var(--text-muted); font-size: 0.82rem; }
.job-row .jr-date { color: var(--text-muted); font-size: 0.78rem; margin-left: auto; }
.job-row.unverified { border-left: 3px solid var(--warn-color); }
.job-row .jr-reason { flex-basis: 100%; color: var(--warn-color); font-size: 0.78rem; }
.job-row.freelance { border-left: 3px solid var(--freelance-color); }
.job-row.gts { border-left: 3px solid var(--gts-color); }
.section-hint { color: var(--text-muted); font-weight: 400; font-size: 0.82rem; }

footer { color: var(--text-muted); font-size: 0.78rem; text-align: center; margin-top: 30px; }
</style>

<div id="root"></div>

<script>
/* --- Data block: the digest routine edits ONLY this script tag's contents. ---

const LAST_UPDATED = "11 Sep 2026, 05:50 PM IST";
const ALL_JOBS = [{"date": "2026-08-07", "title": "Technical Project Manager (P&C Insurance Domain, BPM, Workflow Automation Platforms)", "company": "Prasha Consultancy Services Private Limited", "location": "India (city not stated)", "source": "LinkedIn", "url": "https://in.linkedin.com/jobs/view/technical-project-manager-p-c-insurance-domain-bpm-workflow-automation-platforms-at-prasha-consultancy-services-private-limited-4446047992", "status": "New", "category": "pm"}, {"date": "2026-08-07", "title": "Senior Delivery Manager - Life Insurance Domain", "company": "illumifin India", "location": "Pune City, Maharashtra", "source": "LinkedIn", "url": "https://in.linkedin.com/jobs/view/illumifin-senior-delivery-manager-life-insurance-domain-at-illumifin-india-4447227678", "status": "New", "category": "pm"}, {"date": "2026-08-10", "title": "Quality Assurance Manager - US Life Insurance Domain", "company": "illumifin India", "location": "Pune City, Maharashtra", "source": "LinkedIn", "url": "https://in.linkedin.com/jobs/view/illumifin-quality-assurance-manager-us-life-insurance-domain-at-illumifin-india-4447220709", "status": "New", "category": "qa"}, {"date": "2026-08-10", "title": "Associate Project Manager", "company": "eClerx", "location": "Pune, Maharashtra", "source": "LinkedIn (GitHub issue lead)", "url": "https://www.linkedin.com/jobs/view/4367307316/", "status": "New", "category": "pm"}, {"date": "2026-08-11", "title": "Senior Software Delivery Manager - Life Insurance", "company": "Visara Partners", "location": "Bengaluru, Karnataka", "source": "LinkedIn", "url": "https://in.linkedin.com/jobs/view/senior-software-delivery-manager-life-insurance-at-visara-partners-4449559557", "status": "New", "category": "pm"}, {"date": "2026-08-15", "title": "Portfolio Tooling & AI Enablement Analyst (Lending PMO)", "company": "Seneca Resources", "location": "Not stated in listing", "source": "LinkedIn", "url": "https://www.linkedin.com/jobs/view/portfolio-tooling-ai-enablement-analyst-lending-pmo-17186-at-seneca-resources-company-llc-4432577901", "status": "New", "category": "pm"}, {"date": "2026-08-15", "title": "Director / Senior Manager, Transformation & Change - Wealth Consumer Lending & Deposits", "company": "BMO U.S.", "location": "Illinois, United States", "source": "LinkedIn", "url": "https://www.linkedin.com/jobs/view/director-senior-manager-transformation-change-%E2%80%93-wealth-consumer-lending-deposits-at-bmo-u-s-4425981360", "status": "New", "category": "pm"}, {"date": "2026-08-19", "title": "Delivery Lead - Loan Operations", "company": "Acuity Knowledge Partners (Moody's Analytics)", "location": "Gurugram", "source": "Naukri", "url": "https://www.naukri.com/job-listings-delivery-lead-loan-operations-acuity-knowledge-partners-gurugram-7-to-10-years-240726501467", "status": "New", "category": "pm"}, {"date": "2026-08-20", "title": "Program Manager", "company": "Tenb Fintech", "location": "Gurugram", "source": "Naukri", "url": "https://www.naukri.com/job-listings-program-manager-tenb-fintech-gurugram-1-to-3-years-040425022346", "status": "New", "category": "pm"}, {"date": "2026-08-24", "title": "Technical Delivery Manager", "company": "Barclays Shared Services", "location": "Pune, Maharashtra", "source": "Naukri", "url": "https://www.naukri.com/job-listings-technical-delivery-manager-barclays-shared-services-pune-7-to-12-years-270726502768", "status": "New", "category": "pm"}, {"date": "2026-08-26", "title": "Credit Analysis-FIG/NBFC/FIS (Delivery Lead/Manager)", "company": "Acuity Analytics", "location": "India (city not stated)", "source": "LinkedIn", "url": "https://in.linkedin.com/jobs/view/credit-analysis-fig-nbfc-fis-delivery-lead-manager-at-acuity-analytics-4403373665", "status": "New", "category": "pm"}, {"date": "2026-08-28", "title": "QA and Test Manager", "company": "Procentia Pensions Software Solutions", "location": "United Kingdom", "source": "LinkedIn", "url": "https://uk.linkedin.com/jobs/view/qa-and-test-manager-at-procentia-pensions-software-solutions-4104791556", "status": "New", "category": "qa"}, {"date": "2026-08-28", "title": "Fintech Implementation Manager", "company": "Sunrise Banks", "location": "Sioux Falls, SD", "source": "Indeed", "url": "https://www.indeed.com/viewjob?jk=0a4e63bce510eee3", "status": "New", "category": "pm"}, {"date": "2026-08-28", "title": "Technical Delivery Lead – FinTech & Banking Platforms (Consulting)", "company": "Intellibus", "location": "Reston, VA", "source": "Indeed", "url": "https://www.indeed.com/viewjob?jk=bdd9a12b0d1e31ea", "status": "New", "category": "pm"}, {"date": "2026-08-28", "title": "Senior Tech Delivery Lead (Life Insurance)", "company": "Intellibus", "location": "Reston, VA", "source": "Indeed", "url": "https://www.indeed.com/viewjob?jk=90867be4eb4edffb", "status": "New", "category": "pm"}, {"date": "2026-09-08", "title": "Test Manager / QA Manager, Life Insurance (1-year renewable contract)", "company": "Evolution Singapore", "location": "Singapore", "source": "LinkedIn", "url": "https://sg.linkedin.com/jobs/view/test-manager-qa-manager-life-insurance-1-year-renewable-contract-at-evolution-singapore-4399111720", "status": "New", "category": "qa"}, {"date": "2026-09-11", "title": "Senior Manager, Program Delivery", "company": "Transamerica", "location": "Not stated in listing", "source": "LinkedIn", "url": "https://www.linkedin.com/jobs/view/senior-manager-program-delivery-at-transamerica-4430589342", "status": "New", "category": "pm"}];
const TODAY_JOBS = [{"date": "2026-09-11", "title": "Senior Manager, Program Delivery", "company": "Transamerica", "location": "Not stated in listing", "source": "LinkedIn", "url": "https://www.linkedin.com/jobs/view/senior-manager-program-delivery-at-transamerica-4430589342", "status": "New", "category": "pm"}];
const UNVERIFIED_JOBS = [];
const FREELANCE_JOBS = [];
const GTS_JOBS = [{"date": "2026-09-11", "title": "SAP GTS Functional Consultant", "company": "Tech Mahindra", "location": "Bengaluru, Karnataka", "source": "Naukri", "url": "https://www.naukri.com/job-listings-sap-gts-functional-consultant-tech-mahindra-bengaluru-5-to-10-years-070926023873", "category": "gts"}];
</script>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useRef } = React;

function catLabel(cat) {
  if (cat === "pm") return "PM/Delivery";
  if (cat === "qa") return "QA/Quality";
  if (cat === "gts") return "SAP GTS";
  return "Other";
}

// Result sets render newest-first everywhere on the page.
function sortByDateDesc(jobs) {
  return [...jobs].sort((a, b) => (b.date || "").localeCompare(a.date || ""));
}

function JobCard({ job }) {
  return (
    <a className="job-card" href={job.url} target="_blank" rel="noopener">
      <div className="job-title">{job.title}</div>
      <div className="job-sub">{job.company} &middot; {job.location}</div>
      <div className="badge-row">
        <span className={"badge " + job.category}>{catLabel(job.category)}</span>
        <span className="badge source">{job.source}</span>
      </div>
    </a>
  );
}

function JobRow({ job, variant }) {
  const cls = "job-row" + (variant ? " " + variant : "");
  return (
    <a className={cls} href={job.url} target="_blank" rel="noopener">
      <span className="jr-title">{job.title}</span>
      <span className="jr-meta">{job.company} &middot; {job.location}</span>
      {job.category === "gts"
        ? <span className="badge gts">SAP GTS</span>
        : <span className={"badge " + job.category}>{catLabel(job.category)}</span>}
      <span className="badge source">{job.source}</span>
      {variant === "unverified" && <span className="badge unverified">Unverified</span>}
      {variant === "freelance" && <span className="badge freelance">Freelance</span>}
      <span className="jr-date">{job.date}</span>
      {variant === "unverified" && job.reason && <span className="jr-reason">{job.reason}</span>}
    </a>
  );
}

function ListSection({ title, hint, sectionRef, jobs, variant, emptyText, grid }) {
  const sorted = useMemo(() => sortByDateDesc(jobs), [jobs]);
  return (
    <section ref={sectionRef}>
      <h2>{title}{hint && <span className="section-hint"> &mdash; {hint}</span>}</h2>
      {sorted.length === 0 ? (
        <div className="empty-note">{emptyText}</div>
      ) : grid ? (
        <div className="card-grid">{sorted.map((job) => <JobCard key={job.url} job={job} />)}</div>
      ) : (
        <div className="job-list">{sorted.map((job) => <JobRow key={job.url} job={job} variant={variant} />)}</div>
      )}
    </section>
  );
}

function App() {
  const [search, setSearch] = useState("");
  const [activeCat, setActiveCat] = useState("all");
  const gtsRef = useRef(null);

  const filteredAll = useMemo(() => {
    const q = search.trim().toLowerCase();
    return sortByDateDesc(ALL_JOBS).filter((job) => {
      if (activeCat !== "all" && job.category !== activeCat) return false;
      if (!q) return true;
      const hay = (job.title + " " + job.company + " " + job.location).toLowerCase();
      return hay.indexOf(q) !== -1;
    });
  }, [search, activeCat]);

  return (
    <div className="wrap">
      <header>
        <h1>Job Watch</h1>
        <div className="meta-row">
          <span>Last updated: {LAST_UPDATED}</span>
        </div>
        <div className="stat-strip">
          <div className="stat-tile"><div className="num">{ALL_JOBS.length}</div><div className="label">Total jobs tracked</div></div>
          <div className="stat-tile"><div className="num">{TODAY_JOBS.length}</div><div className="label">Added today</div></div>
          <div className="stat-tile"><div className="num">{UNVERIFIED_JOBS.length}</div><div className="label">Unverified leads</div></div>
          <div className="stat-tile"><div className="num">{FREELANCE_JOBS.length}</div><div className="label">Freelance gigs</div></div>
          <div className="stat-tile"><div className="num">{GTS_JOBS.length}</div><div className="label">SAP GTS roles</div></div>
        </div>
      </header>

      <div className="controls">
        <input
          id="search"
          type="text"
          placeholder="Search title, company, location…"
          autoComplete="off"
          value={search}
          onChange={(e) => setSearch(e.target.value)}
        />
        <div className="tabs">
          <button className={"tab-btn" + (activeCat === "all" ? " active" : "")} onClick={() => setActiveCat("all")}>All</button>
          <button className={"tab-btn" + (activeCat === "pm" ? " active" : "")} onClick={() => setActiveCat("pm")}>Project / Program / Delivery</button>
          <button className={"tab-btn" + (activeCat === "qa" ? " active" : "")} onClick={() => setActiveCat("qa")}>Quality / QA / Test</button>
          <button
            className="tab-btn gts-nav"
            onClick={() => gtsRef.current && gtsRef.current.scrollIntoView({ behavior: "smooth", block: "start" })}
          >
            SAP GTS
          </button>
        </div>
      </div>

      <ListSection
        title="Freelancing"
        hint="contract/freelance Testing & PM gigs, any domain, last 15 days"
        jobs={FREELANCE_JOBS}
        variant="freelance"
        emptyText="No freelance leads right now."
      />

      <ListSection
        title="SAP GTS"
        hint="any SAP Global Trade Services role, any employer, last 15 days"
        sectionRef={gtsRef}
        jobs={GTS_JOBS}
        variant="gts"
        emptyText="No SAP GTS leads right now."
      />

      <ListSection
        title="New Today"
        jobs={TODAY_JOBS}
        grid
        emptyText="No new postings added today."
      />

      <section>
        <h2>All Tracked Jobs</h2>
        {filteredAll.length === 0 ? (
          <div className="empty-note">No jobs match your filters.</div>
        ) : (
          <div className="job-list">{filteredAll.map((job) => <JobRow key={job.url} job={job} />)}</div>
        )}
      </section>

      <ListSection
        title="Unverified Leads"
        hint="reserved for rare, genuinely ambiguous cases (conflicting date signals, etc.) — not just a missing date."
        jobs={UNVERIFIED_JOBS}
        variant="unverified"
        emptyText="No unverified leads right now."
      />

      <footer>Job Watch &middot; auto-generated daily &middot; data sourced from public job listings</footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
